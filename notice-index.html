<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>공지사항</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
/* =======================================================
   이 아래 CONFIG 값만 바꿔서 내용을 수정할 수 있습니다.
   (파일 아래쪽 스크립트 안의 CONFIG 객체를 찾아서 편집하세요)
======================================================= */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:inherit;}
body{
  margin:0;min-height:100%;background:#050510 radial-gradient(ellipse at 50% -10%, #10112b 0%, #05050f 55%, #000 100%) fixed;
  color:#eef0ff;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;position:relative;min-height:100vh;
}
#stars,#meteors{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.3;animation:twinkle ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:1;transform:scale(1.4);}}
.meteor{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
  box-shadow:0 0 8px 2px rgba(255,255,255,.85);opacity:0;
  transform:rotate(135deg) translateX(0);
  animation-name:meteor-move;animation-timing-function:cubic-bezier(.2,.6,.4,1);animation-fill-mode:forwards;}
.meteor::after{content:"";position:absolute;top:50%;left:50%;width:var(--tail,130px);height:1px;
  background:linear-gradient(270deg,rgba(255,255,255,.95),rgba(255,255,255,0));
  transform:translate(-100%,-50%);}
@keyframes meteor-move{0%{opacity:0;transform:rotate(135deg) translateX(0);}
  8%{opacity:1;}70%{opacity:1;}
  100%{opacity:0;transform:rotate(135deg) translateX(var(--dist,480px));}}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));}
.card{width:100%;max-width:560px;background:rgba(18,18,36,.55);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:clamp(24px,6vw,44px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 50px rgba(80,90,255,.12),0 20px 60px rgba(0,0,0,.5);}
.title{margin:0 0 18px;font-size:clamp(22px,5vw,30px);font-weight:700;line-height:1.35;
  background:linear-gradient(90deg,#fff,#c9d4ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.notice-body p{margin:0 0 14px;line-height:1.75;color:#dadfff;word-break:break-word;}
.notice-body p:last-child{margin-bottom:0;}

/* 미리보기(편집) 패널 - 실제 배포와 무관, 이 브라우저에서만 보임 */
.edit-btn{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));
  bottom:calc(18px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);background:rgba(30,30,55,.85);color:#fff;font-size:20px;
  cursor:pointer;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.edit-overlay{position:fixed;inset:0;background:rgba(3,3,10,.7);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:10;}
.edit-overlay.open{display:flex;}
.edit-box{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:#12121f;
  border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;color:#eef0ff;
  font-family:-apple-system,sans-serif;}
.edit-box h2{margin:0 0 6px;font-size:17px;}
.edit-box .hint{font-size:12px;color:#9aa3d8;margin:0 0 14px;line-height:1.5;}
.edit-box label{display:block;font-size:12px;color:#9aa3d8;margin:14px 0 6px;}
.edit-box input,.edit-box textarea{width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:15px;
  font-family:inherit;resize:vertical;}
.row2{display:flex;gap:10px;}
.row2>div{flex:1;}
.bold-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
.bold-row input{width:auto;}
.bold-row label{margin:0;font-size:14px;color:#eef0ff;}
.edit-actions{display:flex;gap:10px;margin-top:18px;}
.edit-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:15px;cursor:pointer;}
#applyBtn{background:#5865f2;color:#fff;font-weight:600;}
#copyBtn{background:rgba(255,255,255,.1);color:#eef0ff;}
.save-msg{min-height:18px;font-size:13px;color:#9aa3d8;margin:10px 0 0;text-align:center;}
</style>
</head>
<body>
<div id="stars"></div>
<div id="meteors"></div>
<div class="wrap">
  <main class="card">
    <h1 class="title" id="titleText"></h1>
    <div class="notice-body" id="bodyText"></div>
  </main>
</div>

<button id="editBtn" class="edit-btn" type="button" aria-label="편집">&#9998;</button>
<div id="editOverlay" class="edit-overlay">
  <div class="edit-box">
    <h2>미리보기 편집</h2>
    <p class="hint">여기서 바꾼 내용은 이 브라우저에만 바로 보여요(실제 배포 아님). "코드 복사" 버튼으로 CONFIG 코드를 복사한 뒤, index.html 파일의 CONFIG 부분에 붙여넣고 다시 배포하면 모두에게 반영돼요.</p>
    <label for="inputTitle">제목</label>
    <input id="inputTitle" type="text">
    <label for="inputBody">내용 (줄바꿈으로 문단 구분)</label>
    <textarea id="inputBody" rows="7"></textarea>
    <div class="row2">
      <div>
        <label for="inputSize">글자 크기(px)</label>
        <input id="inputSize" type="number" min="10" max="60" step="1">
      </div>
      <div>
        <label for="inputIndent">들여쓰기(px)</label>
        <input id="inputIndent" type="number" min="0" max="80" step="1">
      </div>
    </div>
    <div class="bold-row">
      <input id="inputBold" type="checkbox">
      <label for="inputBold">굵게</label>
    </div>
    <div class="edit-actions">
      <button id="applyBtn" type="button">이 화면에 미리보기 적용</button>
    </div>
    <div class="edit-actions">
      <button id="copyBtn" type="button">CONFIG 코드 복사</button>
    </div>
    <p id="saveMsg" class="save-msg"></p>
  </div>
</div>

<script>
/* =======================================================
   CONFIG: 여기 값만 바꾸면 공지 내용이 바뀝니다.
   수정 후 파일을 저장하고 다시 배포(재업로드/재푸시)하세요.
======================================================= */
const CONFIG = {
  title: "공지사항 제목을 입력하세요",
  body: "여기에 공지 내용을 작성하세요.\n오른쪽 아래 연필 아이콘으로 미리보기를 해볼 수 있어요.",
  fontSize: 16,   // 글자 크기(px)
  indent: 0,      // 문단 들여쓰기(px), 0이면 들여쓰기 없음
  bold: false     // 굵게 여부
};
/* ======================================================= */

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderContent(cfg){
  document.title = cfg.title || '공지';
  document.getElementById('titleText').textContent = cfg.title || '';
  var bodyEl = document.getElementById('bodyText');
  var html = String(cfg.body || '')
    .split('\n')
    .filter(function(l){ return l.length > 0; })
    .map(function(l){ return '<p>' + esc(l) + '</p>'; })
    .join('');
  bodyEl.innerHTML = html;
  bodyEl.style.fontSize = (cfg.fontSize || 16) + 'px';
  bodyEl.style.fontWeight = cfg.bold ? '700' : '400';
  var indentPx = (cfg.indent || 0) + 'px';
  Array.prototype.forEach.call(bodyEl.querySelectorAll('p'), function(p){
    p.style.textIndent = indentPx;
  });
}
renderContent(CONFIG);

/* 별 */
var starsEl = document.getElementById('stars');
var starCount = window.innerWidth < 480 ? 70 : 130;
for (var i = 0; i < starCount; i++) {
  var s = document.createElement('div');
  s.className = 'star';
  s.style.left = (Math.random() * 100).toFixed(2) + '%';
  s.style.top = (Math.random() * 100).toFixed(2) + '%';
  var size = (Math.random() * 2 + 1).toFixed(2);
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
  s.style.animationDuration = (Math.random() * 3 + 2).toFixed(2) + 's';
  starsEl.appendChild(s);
}

/* 유성 - 좌측 45도, 속도에 편차 있음, 불규칙 다발 */
var meteorsEl = document.getElementById('meteors');
function spawnMeteor(){
  var m = document.createElement('div');
  m.className = 'meteor';
  m.style.top = (Math.random() * 25 - 5).toFixed(2) + '%';
  m.style.left = (Math.random() * 100 + 20).toFixed(2) + '%';
  var dist = Math.round(Math.random() * 260 + 380);
  var tail = Math.round(dist * 0.28);
  m.style.setProperty('--dist', dist + 'px');
  m.style.setProperty('--tail', tail + 'px');
  var dur = (Math.random() * 3.2 + 1.8).toFixed(2);
  m.style.animationDuration = dur + 's';
  meteorsEl.appendChild(m);
  setTimeout(function(){ if (m.parentNode) m.parentNode.removeChild(m); }, dur * 1000 + 200);
}
function scheduleMeteors(){
  var delay = Math.random() * 2000 + 250;
  setTimeout(function(){
    var count = 1 + Math.floor(Math.random() * 3);
    for (var k = 0; k < count; k++) spawnMeteor();
    scheduleMeteors();
  }, delay);
}
spawnMeteor();
scheduleMeteors();

/* 미리보기 편집 패널 */
var editBtn = document.getElementById('editBtn');
var overlay = document.getElementById('editOverlay');
var applyBtn = document.getElementById('applyBtn');
var copyBtn = document.getElementById('copyBtn');
var saveMsg = document.getElementById('saveMsg');

function openEditor(){
  document.getElementById('inputTitle').value = CONFIG.title || '';
  document.getElementById('inputBody').value = CONFIG.body || '';
  document.getElementById('inputSize').value = CONFIG.fontSize || 16;
  document.getElementById('inputIndent').value = CONFIG.indent || 0;
  document.getElementById('inputBold').checked = !!CONFIG.bold;
  saveMsg.textContent = '';
  overlay.classList.add('open');
}
editBtn.addEventListener('click', openEditor);
overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.classList.remove('open'); });

function readForm(){
  return {
    title: document.getElementById('inputTitle').value || '공지',
    body: document.getElementById('inputBody').value || '',
    fontSize: parseInt(document.getElementById('inputSize').value, 10) || 16,
    indent: parseInt(document.getElementById('inputIndent').value, 10) || 0,
    bold: document.getElementById('inputBold').checked
  };
}

applyBtn.addEventListener('click', function(){
  var next = readForm();
  CONFIG.title = next.title;
  CONFIG.body = next.body;
  CONFIG.fontSize = next.fontSize;
  CONFIG.indent = next.indent;
  CONFIG.bold = next.bold;
  renderContent(CONFIG);
  saveMsg.textContent = '이 화면에 적용했어요 (실제 배포는 아직 아님).';
});

copyBtn.addEventListener('click', function(){
  var next = readForm();
  var code = 'const CONFIG = ' + JSON.stringify(next, null, 2) + ';';
  var doCopy = function(){
    saveMsg.textContent = '복사했어요! index.html의 CONFIG 부분에 붙여넣고 다시 배포하세요.';
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(doCopy).catch(function(){
      saveMsg.textContent = '복사에 실패했어요. 콘솔(F12)에서 CONFIG 값을 확인해주세요.';
      console.log(code);
    });
  } else {
    console.log(code);
    saveMsg.textContent = '이 브라우저는 자동 복사를 지원하지 않아요. 콘솔(F12)에 코드를 출력했어요.';
  }
});
</script>
</body>
</html>
